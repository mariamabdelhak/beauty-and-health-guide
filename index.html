<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الصحة والجمال - مريم عبد الحق</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #fdfaf5; color: #444; margin: 0; padding: 0; text-align: center; }
        header { background: linear-gradient(to right, #d4af37, #b8860b); color: white; padding: 40px 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 1px solid #eee; }
        img { width: 100%; border-radius: 15px; margin-bottom: 15px; }
        h2 { color: #b8860b; }
        p { line-height: 1.8; font-size: 1.1rem; }
    </style>
</head>
<body>
    <header>
        <h1>دليل الصحة والجمال والرياضة</h1>
        <p>إعداد الطالبة: مريم عبد الحق</p>
    </header>
    <div class="container">
        <div class="card">
            <h2>العناية بالبشرة</h2>
            <img src="https://images.unsplash.com/photo-1556228720-195a672e8a03?q=80&w=500">
            <p>الجمال يبدأ من ترطيب البشرة وحمايتها من الشمس يومياً للحفاظ على شبابها ونضارتها.</p>
        </div>
        <div class="card">
            <h2>الرياضة والصحة</h2>
            <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=500">
            <p>النشاط البدني المستمر يقوي المناعة ويحسن الحالة المزاجية. ابدأي بيومك بـ 15 دقيقة رياضة.</p>
        </div>
    </div>
    <footer style="padding: 20px; color: #999;">&copy; 2026 مشروع مريم التعليمي</footer>
</body>
</html>
